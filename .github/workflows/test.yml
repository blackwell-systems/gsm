name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Run tests
      shell: bash
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Run go vet
      shell: bash
      run: go vet ./...

    - name: Check doc snippets
      # Every Go block in the docs (README.md, docs/) type-checks, and every README example
      # marked `run` executes (and so Builds its machine). Also part of go test above;
      # run on its own so a doc failure is visible by name.
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: go test -count=1 -run 'TestDocSnippets' -v .

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.txt
        fail_ci_if_error: false

  oracles:
    # The extracted Coq checkers, built from a pinned proof commit in a
    # digest-pinned image and hash-checked. GSM_REQUIRE_ORACLES=1 makes every
    # oracle test and the differential cross-check required: a missing checker
    # fails the run instead of skipping. See .github/oracle/README.md.
    name: Oracle cross-check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Read pins
      run: cat .github/oracle/pins.env >> "$GITHUB_ENV"

    - name: Checkout the proof at the pinned commit
      uses: actions/checkout@v4
      with:
        repository: ${{ env.NC_REPO }}
        ref: ${{ env.NC_COMMIT }}
        path: nc

    - name: Build the extracted checkers
      run: bash nc/coq/extraction/ci-build.sh "$ROCQ_IMAGE"

    - name: Verify pinned hashes
      # Every file in SHA256SUMS must match, and the two checkers the pins name
      # must be among them, so a checker swapped by pin is never run unhashed.
      run: |
        cd nc/coq/extraction
        sha256sum -c "$GITHUB_WORKSPACE/.github/oracle/SHA256SUMS"
        for c in "$TABLE_CHECKER" "$RULES_CHECKER"; do
          awk -v f="$c" '$2 == f { found = 1 } END { exit !found }' "$GITHUB_WORKSPACE/.github/oracle/SHA256SUMS" ||
            { echo "::error::$c is not in .github/oracle/SHA256SUMS"; exit 1; }
        done

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Oracle tests and differential cross-check
      env:
        GSM_REQUIRE_ORACLES: '1'
        GSM_CONVERGENCE_CHECKER: ${{ github.workspace }}/nc/coq/extraction/${{ env.TABLE_CHECKER }}
        GSM_AST_CHECKER: ${{ github.workspace }}/nc/coq/extraction/${{ env.RULES_CHECKER }}
        GSM_ORACLE_REPORT: ${{ github.workspace }}/oracle-report.txt
      run: go test -count=1 .

    - name: Example-machine gate
      # Every machine gsm's examples make (each Example function and README run
      # block, listed in .github/oracle/machines.txt) is checked by both
      # checkers; the step fails if a checker rejects one, disagrees with Build,
      # or a machine is not listed. See .github/oracle/README.md.
      env:
        GSM_REQUIRE_ORACLES: '1'
        GSM_CONVERGENCE_CHECKER: ${{ github.workspace }}/nc/coq/extraction/${{ env.TABLE_CHECKER }}
        GSM_AST_CHECKER: ${{ github.workspace }}/nc/coq/extraction/${{ env.RULES_CHECKER }}
      run: |
        go test -count=1 ./internal/...
        (cd internal/cmd/gsmgate && go test -count=1 .)
        GSM_GATE_SUMMARY="$GITHUB_STEP_SUMMARY" go test -tags gsmgate -run TestExampleMachinesGate -count=1 -v .

    - name: Differential summary
      if: always()
      run: |
        if [ -f oracle-report.txt ]; then
          { echo '### Differential cross-check'; echo '```'; cat oracle-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi

  oracle-provenance:
    # The in-process table oracle (internal/oracle/oracle_gen.go) is generated from
    # the proof, never written by hand. Regenerate it from the commit, image and
    # generator PROVENANCE pins, and require the same JSON and the same Go, byte
    # for byte. See internal/oracle/PROVENANCE.
    name: Go oracle provenance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Regenerate the oracle from the pinned proof commit
      run: bash internal/oracle/regenerate.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
